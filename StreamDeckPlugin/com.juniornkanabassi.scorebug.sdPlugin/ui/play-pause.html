<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
</head>
<body>
	<div class="row">
		<label for="slot">Slot</label>
		<select id="slot" data-setting="slot" data-numeric>
			<option value="1">1</option>
			<option value="2">2</option>
		</select>
	</div>
	<div class="row">
		<label for="mode">Mode</label>
		<select id="mode" data-setting="mode">
			<option value="toggle">Toggle</option>
			<option value="play">Play only</option>
			<option value="pause">Pause only</option>
		</select>
	</div>
	<p class="hint">Toggle starts or pauses. Play/Pause only send that one command, for separate keys.</p>
	<script src="common.js"></script>
</body>
</html>
