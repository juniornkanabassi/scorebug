<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
</head>
<body>
	<div class="row">
		<label for="slot">Slot</label>
		<select id="slot" data-setting="slot" data-numeric>
			<option value="1">1</option>
			<option value="2">2</option>
		</select>
	</div>
	<div class="row">
		<label for="competitionId">Competition</label>
		<input id="competitionId" list="competitions" data-setting="competitionId" placeholder="e.g. champions-league" />
		<datalist id="competitions">
			<option value="ligue1">Ligue 1</option>
			<option value="premier-league">Premier League</option>
			<option value="champions-league">Champions League</option>
			<option value="europa-league">Europa League</option>
			<option value="conference-league">Conference League</option>
			<option value="la-liga">LaLiga</option>
			<option value="serie-a">Serie A</option>
			<option value="bundesliga">Bundesliga</option>
			<option value="club-world-cup">Club World Cup</option>
			<option value="nations-league">Nations League</option>
			<option value="international">International</option>
		</datalist>
	</div>
	<p class="hint">Matches the competition id in the library (Settings &gt; Library shows every id).</p>
	<script src="common.js"></script>
</body>
</html>
