<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="common.css" />
</head>
<body>
	<div class="row">
		<label for="slot">Slot</label>
		<select id="slot" data-setting="slot" data-numeric>
			<option value="1">1</option>
			<option value="2">2</option>
		</select>
	</div>
	<div class="row">
		<label for="minutes">Set to (minutes)</label>
		<input id="minutes" type="number" min="0" max="15" placeholder="leave blank to nudge" data-setting="minutes" data-numeric />
	</div>
	<div class="row">
		<label for="delta">Nudge by</label>
		<input id="delta" type="number" min="-15" max="15" placeholder="1" data-setting="delta" data-numeric />
	</div>
	<p class="hint">Set "Set to" for an exact announcement (0 clears it). Leave it blank to nudge by the delta instead (default +1).</p>
	<script src="common.js"></script>
</body>
</html>
