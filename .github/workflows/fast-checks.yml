# Fast checks on every pull request: the core engine assertions and the overlay and Stream Deck client checks.
# Unsigned, no secrets, read-only token, disposable data only; nothing is signed, released, published or installed.
# build.sh, release.sh, install.sh, security-check and acceptance-check (a running app on a chosen port) stay on the Mac.
name: Fast checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15   # Package.swift targets macOS 15; plugin-command-check writes under /private/tmp
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # plugin-command-check needs node:module stripTypeScriptTypes
      - name: Invisible test windows and launch flags
        run: swift test
      - name: Core engine assertions (CoreChecks)
        run: swift run CoreChecks
      - name: Real AppModel and OverlayServer, canned providers, temporary home and free port
        run: zsh Scripts/model-check.sh
      - name: Overlay script against a minimal DOM
        run: node Scripts/overlay-check.mjs
      - name: Stream Deck plugin client, transport stubbed
        run: node Scripts/plugin-command-check.mjs
