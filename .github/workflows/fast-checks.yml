# Checks on every pull request through test.sh: tests, core and model checks, grid lint, overlay, CLI and Stream Deck
# client checks, and light and dark native snapshots of every page (uploaded as an artifact).
# Unsigned, no secrets, read-only token, disposable data only; nothing is signed, released, published or installed.
# build.sh, release.sh, install.sh, security-check and acceptance-check (a running app on a chosen port) stay on the Mac.
name: Fast checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15   # Package.swift targets macOS 15; plugin-command-check writes under /private/tmp
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # plugin-command-check needs node:module stripTypeScriptTypes
      - name: Every headless check (test.sh)
        run: zsh test.sh
        env:
          SCOREBUG_SNAPSHOTS: ${{ runner.temp }}/native-snapshots
      - name: Native snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-snapshots
          path: ${{ runner.temp }}/native-snapshots
          if-no-files-found: ignore
