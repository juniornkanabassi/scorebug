    <path d="M300 92 L300 46"/>
    <!-- canopy -->
    <circle cx="300" cy="20" r="30"/>
    <!-- bear body, standing upright -->
    <path d="M150 92 C138 92 130 78 132 62 C134 46 148 36 162 36 C176 36 190 46 192 62 C194 78 186 92 174 92 Z"/>
