  <!-- madrono berries in the canopy -->
  <g fill="#ffffff" stroke="none">
    <circle cx="286" cy="8" r="4"/>
    <circle cx="312" cy="6" r="4"/>
    <circle cx="298" cy="30" r="4"/>
