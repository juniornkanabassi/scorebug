<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 400 120">
  <g transform="translate(400,0) scale(-1,1)">
    <g fill="#ffffff" stroke="none">
      <!-- tail, curling up from the rear over the back, tufted tip -->
      <path d="M160 60 C 138 56 116 42 110 20 C 108 8 116 0 128 2
               C 124 12 128 26 140 34 C 150 40 158 48 160 60 Z"/>
      <circle cx="116" cy="8" r="10"/>
      <!-- body, arched back -->
      <path d="M164 62 L164 46 C 164 38 172 32 182 32
               L244 32 C 252 32 258 38 258 46
               L258 62 C 258 68 252 72 244 72
               L176 72 C 168 72 164 68 164 62 Z"/>
      <!-- mane, a spiky sunburst crown behind and around the head -->
      <polygon points="244.0,-4.0 250.8,13.2 267.1,4.4 261.3,22.0 279.5,25.7 263.7,35.5 275.2,50.0 256.9,47.3 256.3,65.8 244.0,52.0 231.7,65.8 231.1,47.3 212.8,50.0 224.3,35.5 208.5,25.7 226.7,22.0 220.9,4.4 237.2,13.2"/>
      <!-- head, small round profile poking out the right side of the mane -->
      <circle cx="272" cy="34" r="15"/>
      <!-- snout -->
      <ellipse cx="290" cy="38" rx="10" ry="7"/>
      <!-- legs: back pair -->
      <rect x="176" y="70" width="11" height="24" rx="5"/>
      <rect x="198" y="70" width="11" height="20" rx="5" transform="rotate(-10 203 80)"/>
      <!-- legs: front pair, walking stride -->
      <rect x="218" y="70" width="11" height="20" rx="5" transform="rotate(10 223 80)"/>
      <rect x="240" y="70" width="11" height="24" rx="5"/>
    </g>
  </g>
</svg>
