    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 -14 L70 88"/>
      <path d="M70 4 C 130 -6, 170 14, 220 4 C 260 -4, 290 10, 330 6
               L 250 40 C 210 46, 180 30, 140 38 C 110 44, 90 40, 70 46 Z"/>
    </g>
  </g>
  <text x="249" y="34" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-style="italic" font-size="26" fill="#ffffff">PSV</text>
</svg>
