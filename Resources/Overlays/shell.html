<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorebug</title>
<link rel="stylesheet" href="/assets/overlay.css">
<link id="theme-css" rel="stylesheet" href="">
</head>
<body data-orientation="{{ORIENTATION}}" data-slot="{{SLOT}}" data-theme="">
<div id="stage">
  <div id="bug" class="bug hidden">
    <div class="main">
      <div class="comp"><span class="mark"></span><span class="label"></span></div>
      <div class="team home"><span class="crest"></span><span class="code"></span><span class="name"></span></div>
      <div class="score home"><span class="digit"></span></div>
      <div class="sep"><span></span></div>
      <div class="score away"><span class="digit"></span></div>
      <div class="team away"><span class="crest"></span><span class="code"></span><span class="name"></span></div>
      <div class="clock"><span class="time"></span><span class="state"></span></div>
      <div class="added"><span class="plus"></span><span class="counter"></span></div>
      <div class="agg"><span class="home"></span><span class="sep"></span><span class="away"></span></div>
    </div>
    <div class="shootout">
      <div class="kicks home"></div>
      <div class="tally"><span class="home"></span><span class="sep">–</span><span class="away"></span></div>
      <div class="kicks away"></div>
    </div>
    <div class="scorers">
      <div class="list home"></div>
      <div class="list away"></div>
    </div>
  </div>
</div>
<script src="/assets/overlay.js"></script>
</body>
</html>
